# DigitalOcean App Platform specification TEMPLATE (not deployable).
# Instantiated per service by scripts/release tooling once owner values exist.
name: "kitluy-{service}-{environment}" # [REQUIRED: naming approval]
region: sgp # Singapore / SGP1 (infra spec header)
services:
  - name: "{service}"
    dockerfile_path: services/{service}/Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs # [REQUIRED: approved sizes per service]
    health_check:
      http_path: /health/ready
    envs:
      - key: KITLUY_ENV
        value: "{environment}"
      - key: PORT
        value: "8080"
