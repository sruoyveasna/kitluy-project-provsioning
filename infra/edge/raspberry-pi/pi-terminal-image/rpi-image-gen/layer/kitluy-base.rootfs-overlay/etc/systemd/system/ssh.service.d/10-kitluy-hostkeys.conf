# Bind Debian's stock ssh.service to KitLuy host key generation.
#
# kitluy-ssh-hostkeys.service already declares Before=ssh.service, but ordering
# alone only holds when both units happen to be in the same transaction. This
# states the dependency from the consuming side so sshd cannot start before its
# host keys exist no matter how it was pulled in — including a manual
# `systemctl start ssh` during recovery, which is precisely when someone is
# trying to get into a device that will not talk to them.
#
# Requires= rather than Wants=: sshd without host keys does not degrade, it
# fails ExecStartPre and then loops on Restart=on-failure.
[Unit]
Requires=kitluy-ssh-hostkeys.service
After=kitluy-ssh-hostkeys.service
