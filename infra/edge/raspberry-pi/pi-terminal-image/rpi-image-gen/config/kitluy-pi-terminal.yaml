# KitLuy PI_TERMINAL development image.
#
#   rpi-image-gen build -S infra/edge/raspberry-pi/pi-terminal-image/rpi-image-gen -c kitluy-pi-terminal.yaml
#
# Builder pinned by ../upstream.pin (rpi-image-gen v2.7.0).
# One image serves T1–T4; the terminal profile arrives as governed
# configuration after cloud-authorised assignment and is never baked in.
device:
  layer: rpi5

# ACCESS MODEL: public key only, no password anywhere (owner decision
# 2026-08-11). See kitluy-store-hub.yaml for the full reasoning — the two
# profiles share one access posture on purpose, because a terminal that is
# reachable by different means than its Hub is a second security surface.
#
# The key is injected at build time by build-rpi-image.sh as
# IGconf_ssh_pubkey_user1 and is never committed.
ssh:
  pubkey_only: y

layer:
  custom: kitluy-pi-terminal

image:
  layer: image-rota
  name: kitluy-pos-terminal-wayland-arm64
  compression: zstd
  boot_part_size: 128M
  # Kiosk runtime only — no local database, so the system slot is smaller
  # than the Hub's.
  system_part_size: 3G
  # Device identity, cached configuration and the offline operation queue.
  data_part_size: 2G
