# KitLuy OS image — STORE_HUB profile.
#
# The Store Hub is the local operational authority for one Digital Store
# Location. It owns the local PostgreSQL database, serves the LAN /edge/v1 API
# to terminals, and synchronises with cloud Supabase asynchronously.
#
# It is NOT authoritative until assignment and activation succeed
# (000_ACTIVE_PHASE.md §10, the locked provisioning chain).

KITLUY_PROFILE="store-hub"
KITLUY_PROFILE_DEVICE_CLASS="store_hub"

# --- Storage ----------------------------------------------------------------
# NVMe carries the local database. Its serial is a BINDING/TAMPER signal, never
# an identity input (the identity rule, @kitluy/device-identity).
KITLUY_NVME_REQUIRED="yes"
KITLUY_LOCAL_DATABASE="postgresql"
KITLUY_LOCAL_DATABASE_MAJOR_VERSION="15"

# --- Services enabled on this profile ---------------------------------------
KITLUY_PROFILE_SERVICES="kitluy-firstboot kitluy-enrollment-agent kitluy-hub-agent kitluy-health-reporter kitluy-update-agent"

# --- LAN API ----------------------------------------------------------------
# Terminals reach the Hub over authenticated LAN with pinned TLS 1.3.
KITLUY_LAN_BIND_HOST="0.0.0.0"
KITLUY_LAN_PORT="8443"
KITLUY_LAN_TLS_MIN_VERSION="1.3"

# --- Discovery advertisement ------------------------------------------------
# The Hub ADVERTISES; terminals listen. Service name is locked by the bootstrap
# contract (KLD-2026-08-06-WS12-T001-EDGE-BOOTSTRAP-001).
KITLUY_MDNS_ADVERTISE="yes"
KITLUY_MDNS_SERVICE="_kitluy-edge._tcp.local"

# --- Kiosk ------------------------------------------------------------------
# A Hub is headless. No display stack, no browser, no POS client.
KITLUY_KIOSK="disabled"
