# KitLuy OS image — shared build configuration.
#
# Authority:
#   Hub spec §6.8 (signed boot chain, dm-verity, encrypted data partition, A/B slots)
#   KLD-2026-07-28-002 (BLK-005 PKI and device trust owner decision)
#   00_AI_HANDOFF/000_ACTIVE_PHASE.md §10 (the locked provisioning chain)
#
# THIS FILE CARRIES NO SECRETS AND NO PER-DEVICE VALUES.
# Images are zero-secret by construction: per-device trust is established during
# enrollment and pairing, never baked in. A value that would be a secret is a
# [REQUIRED] blocker below, resolved at signing time from the operator's secret
# store — never from this file and never from git.

# --- Image identity ---------------------------------------------------------
KITLUY_IMAGE_NAME="kitluy-os"
KITLUY_IMAGE_SCHEMA_VERSION="1"
# The KITLUY image version, which is NOT the builder version. `deploy-v2.7.0`
# was named after rpi-image-gen's own tag, so two different KitLuy images built
# with the same builder would silently overwrite each other. This value is the
# one that identifies the ARTIFACT, is stamped into /etc/kitluy/image.env, and
# is what a device reports as its image version.
KITLUY_IMAGE_VERSION="0.2.0-dev"

# --- Base operating system --------------------------------------------------
# Raspberry Pi OS 64-bit (Debian-derived). The RELEASE PIN is an owner value:
# an unpinned base makes the image irreproducible and breaks release identity.
KITLUY_BASE_OS="raspberry-pi-os-64"
KITLUY_BASE_OS_RELEASE="[REQUIRED: Raspberry Pi OS release pin — owner decision pending]"
KITLUY_BASE_OS_IMAGE_SHA256="[REQUIRED: base image SHA-256 — owner decision pending]"

# --- Target hardware --------------------------------------------------------
KITLUY_TARGET_ARCH="arm64"
KITLUY_TARGET_BOARD="raspberry-pi-5"

# --- Partition layout (Hub spec §6.8) ---------------------------------------
# A/B slots so an installation can roll back to the previously healthy system.
KITLUY_AB_SLOTS="enabled"
KITLUY_SYSTEM_PARTITION_MODE="read-only-dm-verity"
KITLUY_DATA_PARTITION_MODE="encrypted"

# --- Release trust (BLK-005 gated) ------------------------------------------
# The image signing chain is DECIDED (KLD-2026-07-28-002) but NOT BUILT. Pilot
# and production signing stay blocked until signer custody exists. The build
# refuses to emit a pilot/production artifact while these are unresolved,
# rather than emitting an unsigned artifact that looks releasable.
KITLUY_RELEASE_MANIFEST_VERSION="1"
KITLUY_RELEASE_DIGEST_ALGORITHM="sha256"
KITLUY_RELEASE_SIGNATURE_ALGORITHM="ed25519"
KITLUY_IMAGE_SIGNING_KEY_REF="[REQUIRED: image signing key custody reference — BLK-005 implementation pending]"
KITLUY_SECURE_ELEMENT_MODEL="[REQUIRED: certified TPM 2.0 / secure-element SKU — production BOM decision pending]"

# --- Release channel --------------------------------------------------------
# Owner model, order locked, no skips: internal -> pilot -> stable.
# Only `internal` is buildable while BLK-005 implementation is pending.
KITLUY_RELEASE_CHANNEL="internal"

# --- Cloud enrollment endpoint ---------------------------------------------
# The device-registry-service base URL the firstboot agent talks to. This is a
# PUBLIC endpoint, not a credential. It is left empty here on purpose: an image
# is built for an environment, and the environment supplies it at build time.
KITLUY_ENROLLMENT_BASE_URL=""

# The DEVICE TRUST environment this image enrolls into: development, pilot or
# production (`TrustEnvironment`), which is a different vocabulary from the
# release channel above — a channel says how the software got here, this says
# what trust the fleet extends to it. The agent defaults to `development` when
# unset, which is why a pilot or production image must set it explicitly.
KITLUY_ENVIRONMENT="development"

# --- Locale defaults (owner-locked: Cambodia-first) -------------------------
KITLUY_DEFAULT_TIMEZONE="Asia/Phnom_Penh"
KITLUY_DEFAULT_LOCALES="km-KH,en-US"
