# KitLuy OS image — PI_TERMINAL profile.
#
# A Pi terminal is a local operational CLIENT. It operates through the Store Hub
# over the LAN and never writes to Supabase for normal Store operations
# (CLAUDE.md hard rule 6).
#
# The terminal PROFILE (T1..T4) is NOT baked into the image. It is delivered by
# governed configuration after cloud-authorised assignment. One image serves
# every terminal profile; a terminal that has not been assigned has no profile.

KITLUY_PROFILE="pi-terminal"
KITLUY_PROFILE_DEVICE_CLASS="terminal"

# --- Storage ----------------------------------------------------------------
KITLUY_NVME_REQUIRED="no"
KITLUY_LOCAL_DATABASE="none"

# --- Services enabled on this profile ---------------------------------------
KITLUY_PROFILE_SERVICES="kitluy-firstboot kitluy-enrollment-agent kitluy-terminal-client kitluy-health-reporter kitluy-update-agent"

# --- Hub discovery ----------------------------------------------------------
# The terminal LISTENS for the Hub's advertisement. Manual IP is a fallback
# only, and never overrides a signed endpoint (the locked six-source order in
# the bootstrap contract).
KITLUY_MDNS_DISCOVER="yes"
KITLUY_MDNS_SERVICE="_kitluy-edge._tcp.local"
KITLUY_HUB_MANUAL_ENDPOINT_ALLOWED="fallback-only"

# --- Kiosk runtime ----------------------------------------------------------
KITLUY_KIOSK="enabled"
KITLUY_KIOSK_RUNTIME="electron"
KITLUY_KIOSK_USER="kitluy-terminal"

# --- Peripherals ------------------------------------------------------------
# Peripheral presence is profile-dependent and resolved from delivered
# configuration, not assumed by the image.
KITLUY_PERIPHERAL_SUPPORT="printer scanner customer-display cash-drawer"
