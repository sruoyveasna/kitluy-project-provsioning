# METABEGIN
# X-Env-Layer-Name: kitluy-base
# X-Env-Layer-Category: kitluy
# X-Env-Layer-Desc: KitLuy Pi Terminal common base: device identity bootstrap,
#  firstboot, cloud registration (Factory Enrollment, stage one), health
#  reporting, the update runtime, security hardening and persistent logging.
#  Carries NO secret, NO assignment truth and NO Store authority.
# X-Env-Layer-Version: 0.2.0
# X-Env-Layer-Requires: bookworm-minbase,
#  openssh-server,
#  systemd-timesyncd,
#  fake-hwclock,
#  ca-certificates
# METAEND
---
# NOTE ON TRUSTED TIME
# --------------------
# systemd-timesyncd and fake-hwclock are both required, not either/or. The
# owner-fixed trusted-time model takes the MAXIMUM of RTC time, authenticated
# network time and a persisted floor, and never lets trusted time move
# backwards. A device that cannot establish trusted time cannot prove a
# certificate is currently valid, so this is a security dependency rather than
# a convenience.
#
# WHAT THIS LAYER IS NOT
# ----------------------
# It is the terminal's copy of the Store Hub's base layer
# (infra/kitluy-store-hub-image/rpi-image-gen/layer/kitluy-hub-base.yaml),
# kept deliberately close to it so the two images stay one platform. Two things
# the Hub layer carries are absent here on purpose: the operational-credential
# directory and the development root pin. Both belong to the Hub's certificate
# stage; a terminal's credential custody is a later slice.
mmdebstrap:
  packages:
    # Device agent runtime. Node is the runtime the KitLuy agents are written
    # in. The bootstrap agents are baked (KLD-2026-08-11-DEVICE-BOOTSTRAP-
    # RUNTIME-001); the business application is a governed release and is NOT.
    - nodejs
    # LAN discovery. The Hub advertises _kitluy-edge._tcp.local and the
    # terminal listens for it; both sides need the resolver.
    - avahi-daemon
    - libnss-mdns
    # WI-FI ASSOCIATION ONLY (owner decision 2026-08-24 §7).
    #
    # The active network stack is systemd-networkd and Ethernet DHCP already
    # works; the ONLY missing capability is associating with an access point.
    # NetworkManager was rejected for this milestone: it would replace the
    # network ACTIVATOR to obtain a capability that is missing at a lower layer,
    # which is a larger change and a larger attack surface for no gain here.
    #
    # `iw` is not a dependency of the code but is what a technician needs on
    # tty2 when a radio misbehaves.
    - wpasupplicant
    - iw
    # Storage and integrity tooling for the A/B + encrypted-data layout.
    - cryptsetup
    - e2fsprogs
    # Log persistence — a device that loses its logs on reboot cannot support
    # an incident investigation.
    - systemd-journal-remote
    # THE ZONEINFO DATABASE, DECLARED. The appliance-clock hook below links
    # /etc/localtime to /usr/share/zoneinfo/Asia/Phnom_Penh and REFUSES when
    # that file is absent. On the Store Hub the file was always there because
    # PostgreSQL depends on tzdata; a terminal carries no database, so the first
    # terminal build from this layer (2026-09-03) died in that hook with every
    # later hook — clone hygiene, tty1 ownership, the Wi-Fi seed — never run and
    # the KitLuy overlay never applied. A dependency a hook needs is a
    # dependency this layer names.
    - tzdata

  customize-hooks:
    # Security hardening. Applied as a hook rather than as shipped files so the
    # layer stays readable and the intent stays next to the change.
    - |
      cat > "$1/etc/ssh/sshd_config.d/60-kitluy-hardening.conf" <<'EOF'
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      X11Forwarding no
      EOF
    - |
      cat > "$1/etc/sysctl.d/60-kitluy-hardening.conf" <<'EOF'
      kernel.kptr_restrict=2
      kernel.dmesg_restrict=1
      net.ipv4.conf.all.rp_filter=1
      net.ipv4.conf.all.accept_redirects=0
      net.ipv6.conf.all.accept_redirects=0
      net.ipv4.conf.all.accept_source_route=0
      EOF
    - |
      install -d "$1/etc/systemd/journald.conf.d"
      cat > "$1/etc/systemd/journald.conf.d/60-kitluy.conf" <<'EOF'
      [Journal]
      Storage=persistent
      SystemMaxUse=256M
      MaxRetentionSec=30day
      EOF
    # Device identity lives on the data partition and is created ON the device
    # at firstboot. The directory is created empty and 0700; no key material is
    # ever placed here by the build.
    - install -d -m 0700 "$1/var/lib/kitluy/identity"
    - install -d "$1/etc/kitluy" "$1/var/lib/kitluy" "$1/usr/lib/kitluy"
    # STATE DIRECTORIES FOR THE OTHER AGENTS.
    #
    # Every bootstrap unit runs ProtectSystem=strict and names its own writable
    # path with ReadWritePaths=. systemd REFUSES to start a unit whose
    # ReadWritePaths does not exist — `226/NAMESPACE`, before ExecStart is even
    # reached — so a missing directory is not a first-use failure, it is a
    # service that can never run once. On the first real Raspberry Pi boot
    # (2026-08-13) the health and update agents crash-looped every 30 seconds
    # from boot for exactly this reason.
    #
    # No `enrollment` directory any more: the flash-time ticket agent is retired
    # from this image (KLD-2026-09-03-FACTORY-ENROLLMENT-001).
    - install -d -m 0700 "$1/var/lib/kitluy/health"
    - install -d -m 0700 "$1/var/lib/kitluy/update"
    # THE KIOSK USER, CREATED AT BUILD TIME.
    #
    # `etc/sysusers.d/60-kitluy-terminal.conf` declares this user, and
    # systemd-sysusers can never apply it: the rootfs is erofs, mounted
    # read-only, so /etc/passwd cannot be written on the device. The unit
    # therefore failed `217/USER` on the first real boot.
    #
    # The sysusers file is kept — it remains the declaration of intent and
    # costs nothing — but the user is baked here, where /etc is still writable.
    - |
      chroot "$1" getent group kitluy-terminal >/dev/null 2>&1 \
        || chroot "$1" groupadd --system kitluy-terminal
      chroot "$1" getent passwd kitluy-terminal >/dev/null 2>&1 \
        || chroot "$1" useradd --system --gid kitluy-terminal \
             --home-dir /var/lib/kitluy/terminal --no-create-home \
             --shell /usr/sbin/nologin \
             --comment "KitLuy terminal kiosk runtime" kitluy-terminal
      install -d -m 0700 -o kitluy-terminal -g kitluy-terminal \
        "$1/var/lib/kitluy/terminal" 2>/dev/null \
        || install -d -m 0700 "$1/var/lib/kitluy/terminal"
    # /etc/kitluy/image.env — the identity every KitLuy unit loads via
    # EnvironmentFile. systemd fails a unit whose EnvironmentFile is missing,
    # so it is written here, on the path that produces the real image.
    # Non-secret by construction.
    - |
      cat > "$1/etc/kitluy/image.env" <<'EOF'
      KITLUY_IMAGE_NAME=kitluy-os
      KITLUY_IMAGE_SCHEMA_VERSION=1
      KITLUY_IMAGE_VERSION=0.2.0-dev
      KITLUY_RELEASE_CHANNEL=internal
      KITLUY_DEVICE_CLASS=terminal
      KITLUY_ENROLLMENT_BASE_URL=
      KITLUY_REGISTRATION_URL=
      KITLUY_HARDWARE_PROFILE_KEY=
      # DELIBERATELY EMPTY. The builder must state the environment explicitly.
      #
      # This read `development`, and that was an IMPLICIT SECURITY DEFAULT: the
      # builder never passed IGconf_kitluy_environment, so every image ever
      # produced declared itself a development device by omission — while the
      # development-only paths on both images key on exactly this value.
      #
      # Empty means the readers see `unknown` (`${VAR:-unknown}` fires on empty
      # as well as unset, and `readImageEnv` returns undefined for empty), and
      # every development escape path REFUSES. The assertion further down makes
      # a build that forgot to supply one fail rather than ship this.
      KITLUY_ENVIRONMENT=
      KITLUY_DEFAULT_TIMEZONE=Asia/Phnom_Penh
      KITLUY_DEFAULT_LOCALES=km-KH,en-US
      KITLUY_BASE_PINNED=no
      EOF
    # BUILD-TIME VALUES THIS PATH MAY INJECT. All public addresses or model keys;
    # none is a secret, and an image carrying them is exactly as zero-secret as
    # one without (KLSRC-0162 §34).
    - |
      if [ -n "${IGconf_kitluy_enrollment_url:-}" ]; then
        sed -i "s|^KITLUY_ENROLLMENT_BASE_URL=.*|KITLUY_ENROLLMENT_BASE_URL=${IGconf_kitluy_enrollment_url}|" \
          "$1/etc/kitluy/image.env"
      fi
      # The CLOUD registration route, as a FULL url — Factory Enrollment, stage
      # one. A separate key from KITLUY_ENROLLMENT_BASE_URL on purpose: that
      # names the fleet service, which does not serve this route, and a device
      # that assembled one from the other would POST registrations to a host
      # answering 404 — which it could not tell apart from a genuine refusal.
      if [ -n "${IGconf_kitluy_registration_url:-}" ]; then
        sed -i "s|^KITLUY_REGISTRATION_URL=.*|KITLUY_REGISTRATION_URL=${IGconf_kitluy_registration_url}|" \
          "$1/etc/kitluy/image.env"
      fi
      # The hardware profile KEY, never a UUID. A key names a MODEL, so a
      # generic image may carry one and stay generic (plan §5.2); a UUID would
      # differ per environment and make the image environment-specific.
      if [ -n "${IGconf_kitluy_hardware_profile_key:-}" ]; then
        sed -i "s|^KITLUY_HARDWARE_PROFILE_KEY=.*|KITLUY_HARDWARE_PROFILE_KEY=${IGconf_kitluy_hardware_profile_key}|" \
          "$1/etc/kitluy/image.env"
      fi
      if [ -n "${IGconf_kitluy_device_class:-}" ]; then
        sed -i "s|^KITLUY_DEVICE_CLASS=.*|KITLUY_DEVICE_CLASS=${IGconf_kitluy_device_class}|" \
          "$1/etc/kitluy/image.env"
      fi
      # THE ENVIRONMENT IS REQUIRED, VALIDATED, AND ASSERTED.
      #
      # Not "injected if supplied", like the values above. Those are addresses:
      # a missing one produces a device that says it is unconfigured. This one
      # gates development-only behaviour, so a missing one used to produce a
      # device that quietly enabled it.
      if [ -n "${IGconf_kitluy_environment:-}" ]; then
        case "${IGconf_kitluy_environment}" in
          local|development|staging|pilot|production|disaster_recovery) ;;
          *)
            echo "REFUSED: KITLUY_ENVIRONMENT='${IGconf_kitluy_environment}' is not a KitLuy environment" >&2
            exit 1
            ;;
        esac
        sed -i "s|^KITLUY_ENVIRONMENT=.*|KITLUY_ENVIRONMENT=${IGconf_kitluy_environment}|" \
          "$1/etc/kitluy/image.env"
      fi
      # Fail the BUILD, not the boot. An image with no environment is one whose
      # security posture nobody stated; shipping it and letting the device refuse
      # at 03:00 moves a knowable build error into a shop.
      baked="$(sed -n 's/^KITLUY_ENVIRONMENT=//p' "$1/etc/kitluy/image.env")"
      if [ -z "$baked" ]; then
        echo "REFUSED: this image declares no KITLUY_ENVIRONMENT." >&2
        echo "  Pass --environment to build-rpi-image.sh. It is not defaulted:" >&2
        echo "  the development-only paths key on it." >&2
        exit 1
      fi
    # =========================================================================
    # THE APPLIANCE CLOCK READS Asia/Phnom_Penh, AND NOBODY IS ASKED.
    # =========================================================================
    # `KITLUY_DEFAULT_TIMEZONE=Asia/Phnom_Penh` has been in image.env since the
    # file existed and is read by NO code. The built Hub artifact carried
    # /etc/localtime -> Europe/London, the Debian default nobody chose — so every
    # journal line and every `date` a technician ran on tty2 was seven hours out
    # for a Cambodian shop.
    #
    # There is no timezone-selection step and there must never be one (owner
    # decision 2026-08-24 §3): the installer is not asked, and the Store Location
    # already owns the business timezone in the control plane.
    #
    # This is the APPLIANCE and BUSINESS presentation clock. It is NOT the
    # trusted-time authority and it does not touch it: trusted time is
    # established server-side and compared in UTC throughout.
    #
    # /etc is EROFS at runtime, so this must be baked here where it is still
    # writable — the same constraint that moved the kiosk user into the build.
    - |
      TZ="${IGconf_kitluy_timezone:-Asia/Phnom_Penh}"
      if [ ! -f "$1/usr/share/zoneinfo/$TZ" ]; then
        echo "KLUY-IMAGE: no zoneinfo file for timezone $TZ — is tzdata in this layer's packages?" >&2
        exit 1
      fi
      printf '%s\n' "$TZ" > "$1/etc/timezone"
      ln -sf "/usr/share/zoneinfo/$TZ" "$1/etc/localtime"
      sed -i "s|^KITLUY_DEFAULT_TIMEZONE=.*|KITLUY_DEFAULT_TIMEZONE=$TZ|" "$1/etc/kitluy/image.env"
    # CLONE HYGIENE (mission §15). A golden image must not carry a machine
    # identity, or every device flashed from it enrolls as the same device.
    # Truncating rather than deleting makes systemd regenerate a unique
    # machine-id on first boot; deleting the file can leave it unset.
    - |
      : > "$1/etc/machine-id"
      rm -f "$1/var/lib/dbus/machine-id"
      ln -sf /etc/machine-id "$1/var/lib/dbus/machine-id"
    # No pre-seeded SSH host keys — cloned host keys would let one device
    # impersonate another on the LAN. kitluy-ssh-hostkeys.service regenerates
    # them per device at first boot, into the slot-shared /etc/ssh.
    - rm -f "$1"/etc/ssh/ssh_host_*
    # CLONE HYGIENE, second class of shared key. Debian's `ssl-cert` package
    # generates /etc/ssl/private/ssl-cert-snakeoil.key at install time, so it is
    # baked into the golden image and EVERY device flashed from it would share
    # one private key. Nothing in this image serves TLS with it — but a shared
    # private key across a fleet is exactly the property clone hygiene exists to
    # prevent. Caught by scan-image-secrets.sh against the BUILT image.
    - rm -f "$1"/etc/ssl/private/ssl-cert-snakeoil.key "$1"/etc/ssl/certs/ssl-cert-snakeoil.pem
    # =========================================================================
    # TTY1 OWNERSHIP IS DECIDED HERE, NOT CONTESTED AT BOOT.
    # =========================================================================
    # A KitLuy device is an appliance: an operator must never meet `login:` as
    # the product. The KitLuy console unit declares
    # `Conflicts=getty@tty1.service`, but Conflicts ALONE leaves three ways for a
    # login prompt to appear on tty1, all three verified present in a built
    # artifact before this hook existed:
    #
    #   1. `getty@tty1.service` is still enabled in `getty.target.wants/` by the
    #      Debian preset, so getty and the KitLuy console are both wanted and
    #      race. Conflicts is explicitly "orthogonal to ordering".
    #   2. `systemd-logind` autospawns `autovt@ttyN.service`, which is the SAME
    #      program under a DIFFERENT unit name that Conflicts= does not match.
    #   3. The KitLuy console uses `Restart=always`; each restart releases and
    #      re-acquires tty1, reopening the window in 1 and 2.
    #
    # So getty is removed from tty1 and autospawn is switched off.
    #
    # MAINTENANCE ACCESS IS PRESERVED, deliberately: getty is ENABLED ON tty2. A
    # technician presses Ctrl+Alt+F2 and gets the normal authenticated Debian
    # login; SSH with governed keys is unchanged. tty1 belongs to the product,
    # tty2 to maintenance.
    - |
      rm -f "$1/etc/systemd/system/getty.target.wants/getty@tty1.service"
      install -d "$1/etc/systemd/system/getty.target.wants"
      ln -sf /lib/systemd/system/getty@.service \
        "$1/etc/systemd/system/getty.target.wants/getty@tty2.service"
    - |
      install -d "$1/etc/systemd/logind.conf.d"
      cat > "$1/etc/systemd/logind.conf.d/10-kitluy-appliance.conf" <<'EOF'
      [Login]
      # No VT gets an automatic login shell. Without this, logind starts
      # autovt@tty1 (an alias of getty@) whenever tty1 is activated, which no
      # Conflicts= on `getty@tty1.service` can prevent because the unit NAME
      # differs. getty on tty2 is enabled explicitly above and is unaffected.
      NAutoVTs=0
      ReserveVT=0
      EOF
    # =========================================================================
    # ETHERNET IS PREFERRED. THE KERNEL DECIDES, NOT A PROGRAM.
    # =========================================================================
    # The rpi device layer generates 01-eth0.network and 02-wlan0.network with
    # nothing but `DHCP=yes`, which leaves two questions unanswered: with BOTH
    # links up, which default route wins (undefined), and does an unconfigured
    # wlan0 hold `network-online.target` for its full timeout on every boot
    # (yes). RouteMetric answers the first in the routing table;
    # RequiredForOnline answers the second. These OVERWRITE the generated files.
    - |
      cat > "$1/etc/systemd/network/01-eth0.network" <<'EOF'
      [Match]
      Name=eth0

      [Network]
      DHCP=yes

      [DHCPv4]
      # UseHostname=no: the appliance names itself at firstboot and never takes a
      # hostname from a DHCP lease. With the default (yes) networkd asks
      # systemd-hostnamed to apply the lease's hostname, and hostnamed cannot
      # start on this read-only erofs root (226/NAMESPACE, "Failed to set up
      # mount namespacing: /run/systemd/unit-root/dev: Read-only file system"),
      # so every boot carried one failed unit — seen on the first terminal boot
      # and on the Store Hub alike (2026-09-03).
      UseHostname=no
      # Lower metric wins. Ethernet is the canonical terminal installation.
      RouteMetric=100

      [Link]
      # A wired terminal must not report itself online before its cable is usable.
      RequiredForOnline=yes
      EOF
    - |
      cat > "$1/etc/systemd/network/02-wlan0.network" <<'EOF'
      [Match]
      Name=wlan0

      [Network]
      DHCP=yes

      [DHCPv4]
      # UseHostname=no: the appliance names itself at firstboot and never takes a
      # hostname from a DHCP lease. With the default (yes) networkd asks
      # systemd-hostnamed to apply the lease's hostname, and hostnamed cannot
      # start on this read-only erofs root (226/NAMESPACE, "Failed to set up
      # mount namespacing: /run/systemd/unit-root/dev: Read-only file system"),
      # so every boot carried one failed unit — seen on the first terminal boot
      # and on the Store Hub alike (2026-09-03).
      UseHostname=no
      # Higher metric: Wi-Fi carries Store traffic only when Ethernet cannot.
      RouteMetric=600

      [Link]
      # THE BOOT-DELAY FIX. Without this, a wired-only terminal waits out
      # systemd-networkd-wait-online's timeout on every boot because wlan0 never
      # becomes routable. Nothing that matters is ordered behind Wi-Fi.
      RequiredForOnline=no
      EOF
    # =========================================================================
    # WHERE THE SHOP'S WI-FI PASSWORD WILL LIVE.
    # =========================================================================
    # In wpa_supplicant's own configuration file, 0600 and root-owned — the
    # operating system's credential store. The file SEEDED here contains no
    # network and therefore no secret: a ctrl_interface so `wpa_cli` can reach
    # the daemon, and `update_config=1`. The image stays zero-secret.
    #
    # /etc/wpa_supplicant is declared SLOT-SHARED in slot-shared.d — see that
    # file for why per-slot would lose the shop's Wi-Fi on every A/B update.
    # The screen that joins a network arrives with the graphical Device Shell;
    # until then a wired installation is the supported path.
    - |
      install -d -m 0700 "$1/etc/wpa_supplicant"
      cat > "$1/etc/wpa_supplicant/wpa_supplicant-wlan0.conf" <<'EOF'
      ctrl_interface=/run/wpa_supplicant
      update_config=1
      EOF
      chmod 0600 "$1/etc/wpa_supplicant/wpa_supplicant-wlan0.conf"
    # The supplicant runs for wlan0 whenever the adapter exists. Debian's
    # template unit already binds to the interface, so a board without a radio
    # simply never starts it rather than failing.
    - |
      install -d "$1/etc/systemd/system/multi-user.target.wants"
      ln -sf /lib/systemd/system/wpa_supplicant@.service \
        "$1/etc/systemd/system/multi-user.target.wants/wpa_supplicant@wlan0.service"
    # A crypto library's own TEST VECTORS, which are 2.8 MB of PEM-shaped
    # fixtures that nothing on a terminal ever executes. `scan-image-secrets.sh`
    # matched them as private key material and failed the built Hub image. The
    # LIBRARY stays: `rpi-eeprom-config` imports Cryptodome to handle signed
    # Pi 5 EEPROM images, so removing the package would break firmware tooling
    # on the very board this image targets.
    - rm -rf "$1"/usr/lib/python3/dist-packages/Cryptodome/SelfTest
