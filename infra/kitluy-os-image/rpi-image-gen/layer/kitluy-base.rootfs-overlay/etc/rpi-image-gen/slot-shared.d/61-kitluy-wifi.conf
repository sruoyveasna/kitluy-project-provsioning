# THE SHOP'S WI-FI MUST SURVIVE BOTH EROFS AND AN A/B UPDATE.
#
# `image-rota` builds the system slot as EROFS behind a dm-verity hash tree, so
# /etc is immutable at runtime. A Wi-Fi configuration written into /etc on the
# running slot fails with EROFS, and the installer's only route onto the network
# is a screen that cannot save what they typed.
#
# Declaring the path slot-shared is upstream's own answer, and the same
# mechanism 60-kitluy-ssh.conf uses for host keys: the generator bind-mounts
# /persistent/shared/etc/wpa_supplicant over /etc/wpa_supplicant at early boot,
# and persistent-shared-init seeds it from the image copy first — so the
# zero-secret skeleton (ctrl_interface + update_config, no network block) still
# arrives from the rootfs while the directory itself becomes writable.
#
# SHARED ACROSS SLOTS ON PURPOSE, for the same reason host keys are. Shop Wi-Fi
# is SITE configuration, not system configuration. Per-slot, an A/B update would
# silently drop the credentials the shop is reachable through, and the Hub would
# come back from a routine update with no network — a failure nobody would think
# to blame on an update, in a shop that has no Ethernet by definition, since a
# wired Hub would never have been given Wi-Fi in the first place.
#
# The file inside stays 0600 and root-owned. This declaration changes WHERE it
# lives, never who can read it.
Version=1
Path=/etc/wpa_supplicant
