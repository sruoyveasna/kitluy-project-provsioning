# METABEGIN
# X-Env-Layer-Name: kitluy-hub-base
# X-Env-Layer-Category: kitluy
# X-Env-Layer-Desc: KitLuy managed-device common base. Shared by the Store Hub
#  and Pi terminal profiles: device identity bootstrap, firstboot, the cloud
#  enrollment agent, health reporting, the update runtime, security hardening
#  and persistent logging. Carries NO secret and NO assignment truth.
# X-Env-Layer-Version: 0.1.0
# X-Env-Layer-Requires: bookworm-minbase,
#  openssh-server,
#  systemd-timesyncd,
#  fake-hwclock,
#  ca-certificates
# METAEND
---
# NOTE ON TRUSTED TIME
# --------------------
# systemd-timesyncd and fake-hwclock are both required, not either/or. The
# owner-fixed trusted-time model takes the MAXIMUM of RTC time, authenticated
# network time and a persisted floor, and never lets trusted time move
# backwards. A device that cannot establish trusted time cannot prove a
# certificate is currently valid, so this is a security dependency rather than
# a convenience.
mmdebstrap:
  packages:
    # Device agent runtime. Node is the runtime the KitLuy agents are written
    # in; the agent code itself is delivered by the governed release system,
    # not baked here (mission §27: OS image is not an application release).
    - nodejs
    # LAN discovery. The Hub advertises _kitluy-edge._tcp.local and the
    # terminal listens for it; both sides need the resolver.
    - avahi-daemon
    - libnss-mdns
    # Storage and integrity tooling for the A/B + encrypted-data layout.
    - cryptsetup
    - e2fsprogs
    # Log persistence — a device that loses its logs on reboot cannot support
    # an incident investigation.
    - systemd-journal-remote

  customize-hooks:
    # Security hardening. Applied as a hook rather than as shipped files so the
    # layer stays readable and the intent stays next to the change.
    - |
      cat > "$1/etc/ssh/sshd_config.d/60-kitluy-hardening.conf" <<'EOF'
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      X11Forwarding no
      EOF
    - |
      cat > "$1/etc/sysctl.d/60-kitluy-hardening.conf" <<'EOF'
      kernel.kptr_restrict=2
      kernel.dmesg_restrict=1
      net.ipv4.conf.all.rp_filter=1
      net.ipv4.conf.all.accept_redirects=0
      net.ipv6.conf.all.accept_redirects=0
      net.ipv4.conf.all.accept_source_route=0
      EOF
    - |
      install -d "$1/etc/systemd/journald.conf.d"
      cat > "$1/etc/systemd/journald.conf.d/60-kitluy.conf" <<'EOF'
      [Journal]
      Storage=persistent
      SystemMaxUse=256M
      MaxRetentionSec=30day
      EOF
    # Device identity lives on the encrypted data partition and is created ON
    # the device at firstboot. The directory is created empty and 0700; no key
    # material is ever placed here by the build.
    - install -d -m 0700 "$1/var/lib/kitluy/identity"
    - install -d "$1/etc/kitluy" "$1/var/lib/kitluy" "$1/usr/lib/kitluy"
    # STATE DIRECTORIES FOR THE OTHER THREE AGENTS.
    #
    # Every bootstrap unit runs ProtectSystem=strict and names its own writable
    # path with ReadWritePaths=. systemd REFUSES to start a unit whose
    # ReadWritePaths does not exist — `226/NAMESPACE`, before ExecStart is even
    # reached — so a missing directory is not a first-use failure, it is a
    # service that can never run once.
    #
    # Only `identity` existed. On the first real Raspberry Pi boot
    # (2026-08-13, pi5-zjjtir) kitluy-firstboot came up and the enrollment,
    # health and update agents each crash-looped every 30 seconds from boot,
    # having never executed a line of their own code. firstboot worked for
    # exactly one reason: `identity` is the one directory that was created.
    - install -d -m 0700 "$1/var/lib/kitluy/enrollment"
    - install -d -m 0700 "$1/var/lib/kitluy/health"
    - install -d -m 0700 "$1/var/lib/kitluy/update"
    # THE KIOSK USER, CREATED AT BUILD TIME.
    #
    # `etc/sysusers.d/60-kitluy-terminal.conf` declares this user, and
    # systemd-sysusers can never apply it: the rootfs is erofs, mounted
    # read-only, so /etc/passwd cannot be written on the device. The unit
    # therefore failed `217/USER` on the same first boot.
    #
    # The sysusers file is kept — it remains the declaration of intent and
    # costs nothing — but the user is baked here, where /etc is still writable.
    - |
      chroot "$1" getent group kitluy-terminal >/dev/null 2>&1 \
        || chroot "$1" groupadd --system kitluy-terminal
      chroot "$1" getent passwd kitluy-terminal >/dev/null 2>&1 \
        || chroot "$1" useradd --system --gid kitluy-terminal \
             --home-dir /var/lib/kitluy/terminal --no-create-home \
             --shell /usr/sbin/nologin \
             --comment "KitLuy terminal kiosk runtime" kitluy-terminal
      install -d -m 0700 -o kitluy-terminal -g kitluy-terminal \
        "$1/var/lib/kitluy/terminal" 2>/dev/null \
        || install -d -m 0700 "$1/var/lib/kitluy/terminal"
    # /etc/kitluy/image.env — the identity every KitLuy unit loads via
    # EnvironmentFile. It existed only on the staged path, so units on the REAL
    # image referenced a file that was never created; systemd fails a unit whose
    # EnvironmentFile is missing, which would have taken the whole bootstrap
    # runtime down on first boot. Non-secret by construction.
    - |
      cat > "$1/etc/kitluy/image.env" <<'EOF'
      KITLUY_IMAGE_NAME=kitluy-os
      KITLUY_IMAGE_SCHEMA_VERSION=1
      KITLUY_IMAGE_VERSION=0.2.0-dev
      KITLUY_RELEASE_CHANNEL=internal
      KITLUY_DEVICE_CLASS=terminal
      KITLUY_ENROLLMENT_BASE_URL=
      KITLUY_REGISTRATION_URL=
      KITLUY_HARDWARE_PROFILE_KEY=
      KITLUY_ENVIRONMENT=development
      KITLUY_DEFAULT_TIMEZONE=Asia/Phnom_Penh
      KITLUY_DEFAULT_LOCALES=km-KH,en-US
      KITLUY_BASE_PINNED=no
      EOF
    # THE ONE BUILD-TIME VALUE THIS PATH MAY INJECT.
    #
    # `build-image.sh` has carried an enrollment-URL override since it existed;
    # this path — the one that produces the actual .img — did not, so every
    # flashable card was built with an EMPTY endpoint and reported
    # "no enrollment endpoint is configured" on first boot no matter how it was
    # built. Baking it here is what makes a card CLONEABLE: copy the card and
    # every copy already knows where the fleet service is.
    #
    # Still not a secret. It is a public address, and an image carrying it is
    # exactly as zero-secret as one without (KLSRC-0162 §34).
    - |
      if [ -n "${IGconf_kitluy_enrollment_url:-}" ]; then
        sed -i "s|^KITLUY_ENROLLMENT_BASE_URL=.*|KITLUY_ENROLLMENT_BASE_URL=${IGconf_kitluy_enrollment_url}|" \
          "$1/etc/kitluy/image.env"
      fi
      # The CLOUD registration route, as a FULL url. A separate key from
      # KITLUY_ENROLLMENT_BASE_URL on purpose: that names the fleet service,
      # which does not serve this route, and a device that assembled one from
      # the other would POST registrations to a host answering 404 — which it
      # could not tell apart from a genuine refusal.
      if [ -n "${IGconf_kitluy_registration_url:-}" ]; then
        sed -i "s|^KITLUY_REGISTRATION_URL=.*|KITLUY_REGISTRATION_URL=${IGconf_kitluy_registration_url}|" \
          "$1/etc/kitluy/image.env"
      fi
      # The hardware profile KEY, never a UUID. A key names a MODEL, so a
      # generic image may carry one and stay generic (plan §5.2); a UUID would
      # differ per environment and make the image environment-specific.
      if [ -n "${IGconf_kitluy_hardware_profile_key:-}" ]; then
        sed -i "s|^KITLUY_HARDWARE_PROFILE_KEY=.*|KITLUY_HARDWARE_PROFILE_KEY=${IGconf_kitluy_hardware_profile_key}|" \
          "$1/etc/kitluy/image.env"
      fi
      if [ -n "${IGconf_kitluy_device_class:-}" ]; then
        sed -i "s|^KITLUY_DEVICE_CLASS=.*|KITLUY_DEVICE_CLASS=${IGconf_kitluy_device_class}|" \
          "$1/etc/kitluy/image.env"
      fi
      if [ -n "${IGconf_kitluy_environment:-}" ]; then
        sed -i "s|^KITLUY_ENVIRONMENT=.*|KITLUY_ENVIRONMENT=${IGconf_kitluy_environment}|" \
          "$1/etc/kitluy/image.env"
      fi
    # CLONE HYGIENE (mission §15). A golden image must not carry a machine
    # identity, or every device flashed from it enrolls as the same device.
    # Truncating rather than deleting makes systemd regenerate a unique
    # machine-id on first boot; deleting the file can leave it unset.
    - |
      : > "$1/etc/machine-id"
      rm -f "$1/var/lib/dbus/machine-id"
      ln -sf /etc/machine-id "$1/var/lib/dbus/machine-id"
    # No pre-seeded SSH host keys — cloned host keys would let one device
    # impersonate another on the LAN.
    - rm -f "$1"/etc/ssh/ssh_host_*
    # CLONE HYGIENE, second class of shared key. Debian's `ssl-cert` package
    # generates /etc/ssl/private/ssl-cert-snakeoil.key at install time, so it is
    # baked into the golden image and EVERY device flashed from it would share
    # one private key. It is a self-signed placeholder rather than a KitLuy
    # credential, and nothing in this image serves TLS with it — but a shared
    # private key across a fleet is exactly the property clone hygiene exists to
    # prevent, and it is removed for the same reason the SSH host keys are.
    # Caught by scan-image-secrets.sh against the BUILT image, which is the
    # check the staged-tree scan could not perform.
    - rm -f "$1"/etc/ssl/private/ssl-cert-snakeoil.key "$1"/etc/ssl/certs/ssl-cert-snakeoil.pem
    # =========================================================================
    # TTY1 OWNERSHIP IS DECIDED HERE, NOT CONTESTED AT BOOT.
    # =========================================================================
    # A KitLuy device is an appliance: an operator must never meet `login:` as
    # the product. The KitLuy console unit already declares
    # `Conflicts=getty@tty1.service`, but Conflicts ALONE leaves three ways for a
    # login prompt to appear on tty1, all three verified present in the built
    # artifact before this hook existed:
    #
    #   1. `getty@tty1.service` is still enabled in `getty.target.wants/` by the
    #      Debian preset, so getty and the KitLuy console are both wanted and
    #      race. Conflicts is explicitly "orthogonal to ordering", and no
    #      ordering was declared between them.
    #   2. `systemd-logind` autospawns `autovt@ttyN.service` on VT activation.
    #      `autovt@.service` is a symlink to `getty@.service`, so it is the SAME
    #      program under a DIFFERENT unit name — and `Conflicts=getty@tty1.service`
    #      does not name it. Default `NAutoVTs=6` covers tty1.
    #   3. The KitLuy console uses `Restart=always`; each restart releases and
    #      re-acquires tty1, reopening the window in 1 and 2.
    #
    # So getty is removed from tty1 and autospawn is switched off, which makes the
    # outcome deterministic instead of a race.
    #
    # MAINTENANCE ACCESS IS PRESERVED, deliberately (this must not become a device
    # that cannot be recovered): getty is ENABLED ON tty2 instead. A technician
    # presses Ctrl+Alt+F2 and gets the normal authenticated Debian login; SSH with
    # governed keys is unchanged. tty1 belongs to the product, tty2 to maintenance.
    - |
      rm -f "$1/etc/systemd/system/getty.target.wants/getty@tty1.service"
      install -d "$1/etc/systemd/system/getty.target.wants"
      ln -sf /lib/systemd/system/getty@.service \
        "$1/etc/systemd/system/getty.target.wants/getty@tty2.service"
    - |
      install -d "$1/etc/systemd/logind.conf.d"
      cat > "$1/etc/systemd/logind.conf.d/10-kitluy-appliance.conf" <<'EOF'
      [Login]
      # No VT gets an automatic login shell. Without this, logind starts
      # autovt@tty1 (an alias of getty@) whenever tty1 is activated, which no
      # Conflicts= on `getty@tty1.service` can prevent because the unit NAME
      # differs. getty on tty2 is enabled explicitly above and is unaffected.
      NAutoVTs=0
      ReserveVT=0
      EOF
    # A crypto library's own TEST VECTORS, which are 2.8 MB of PEM-shaped
    # fixtures — a third of the package — that nothing on a Hub ever executes.
    #
    # `scan-image-secrets.sh` matched them as "[SECRET] Private key material" and
    # failed the built image. They are not KitLuy material, but the right answer
    # is not to teach the scanner to ignore a directory named SelfTest: it is to
    # stop shipping test data to a shop. A scanner that is permanently red is a
    # scanner nobody reads, and the next real finding would land in that noise.
    #
    # The LIBRARY stays. `rpi-eeprom-config` imports Cryptodome to handle signed
    # Pi 5 EEPROM images, so removing the package would break firmware tooling on
    # the very board this image targets — verified by reading the shipped script,
    # not assumed from the package name.
    - rm -rf "$1"/usr/lib/python3/dist-packages/Cryptodome/SelfTest
