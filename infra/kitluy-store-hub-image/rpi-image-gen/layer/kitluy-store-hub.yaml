# METABEGIN
# X-Env-Layer-Name: kitluy-store-hub
# X-Env-Layer-Category: kitluy
# X-Env-Layer-Desc: KitLuy Store Hub profile. Local PostgreSQL on NVMe, the Hub
#  agent serving the LAN /edge/v1 API, sync services and mDNS advertisement.
#  Headless — a Hub never runs a POS surface.
# X-Env-Layer-Version: 0.1.0
# X-Env-Layer-Requires: kitluy-hub-base
# METAEND
---
mmdebstrap:
  packages:
    # The Hub is the local operational authority for one Store Location and
    # owns the local database. Major version matches the cloud contract.
    - postgresql-15
    - postgresql-client-15

  customize-hooks:
    - install -d "$1/var/lib/kitluy/hub"
    - install -d -m 0700 "$1/var/lib/kitluy/hub/postgresql"
    # Non-secret Hub runtime configuration.
    #
    # The local database DSN is deliberately ABSENT. It is created on the
    # device at activation, because a DSN written here would be a credential
    # baked into a golden image.
    - |
      cat > "$1/etc/kitluy/hub.env" <<'EOF'
      # The names below are the ones the agent actually READS
      # (services/kitluy-hub-agent/src/main.ts). They previously carried a
      # `KITLUY_LAN_*` prefix that no code looks for, so every value in this file
      # was inert: the agent would silently use its own defaults and nothing
      # would report the mismatch.
      #
      # 7443, NOT 8443. `EDGE_LAN_PORT` is 7443 (owner package §3) and a terminal
      # REJECTS a discovery record advertising any other port — so a Hub serving
      # 8443 would be refused by every terminal that found it, after a signature
      # that verified correctly. That is the hardest kind of failure to diagnose.
      HUB_LAN_PORT=7443
      HUB_LAN_TLS_MIN_VERSION=1.3
      HUB_MDNS_SERVICE=_kitluy-edge._tcp.local
      HUB_LOCAL_DATABASE=postgresql
      HUB_LOCAL_DATABASE_MAJOR_VERSION=15
      HUB_NVME_REQUIRED=yes
      # HUB_LAN_BIND_HOST is deliberately NOT set here.
      #
      # It used to read `0.0.0.0`, which `createEdgeTlsServer` refuses outright
      # (FORBIDDEN_BINDS) — a Hub configured from that value could never start.
      # The correct value is a real interface address, which is not knowable at
      # build time, so the runtime has to resolve one. No value is written rather
      # than a wrong one: a wrong value in a golden image is one somebody later
      # trusts.
      EOF
    # The Hub ADVERTISES; terminals listen. The service name is locked by the
    # bootstrap contract (KLD-2026-08-06-WS12-T001-EDGE-BOOTSTRAP-001) and must
    # not be renamed here.
    - |
      cat > "$1/etc/avahi/services/kitluy-edge.service" <<'EOF'
      <?xml version="1.0" standalone='no'?>
      <!DOCTYPE service-group SYSTEM "avahi-service.dtd">
      <service-group>
        <name replace-wildcards="yes">KitLuy Store Hub on %h</name>
        <service>
          <type>_kitluy-edge._tcp</type>
          <!-- Must match HUB_LAN_PORT above and EDGE_LAN_PORT in code. A
               terminal rejects a discovery record whose port is not 7443, so an
               advert on any other port sends it to an address it will refuse. -->
          <port>7443</port>
        </service>
      </service-group>
      EOF
    # A Hub does not become local Store authority by being imaged. It becomes
    # authority only after cloud-governed assignment and activation, so nothing
    # here enables the Hub agent's authority — only its ability to ask.
    - install -d "$1/var/lib/kitluy/hub/outbox"
