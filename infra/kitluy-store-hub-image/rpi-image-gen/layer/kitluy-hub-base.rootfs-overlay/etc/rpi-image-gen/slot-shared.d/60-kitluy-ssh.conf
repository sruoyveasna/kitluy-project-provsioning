# CLONE HYGIENE, THIRD HALF: somewhere to actually put the keys.
#
# kitluy-hub-base.yaml deletes /etc/ssh/ssh_host_* from the golden image, and
# kitluy-ssh-hostkeys.service regenerates them per device at first boot. Both
# are right. But `image-rota` builds the system slot as EROFS behind a
# dm-verity hash tree, so /etc/ssh is immutable at runtime: `ssh-keygen -A`
# fails with EROFS, ssh.service Requires= it, and sshd never starts — the same
# unreachable device the regeneration unit was written to prevent.
#
# Declaring /etc/ssh slot-shared is upstream's own answer (image/gpt/
# ab_userdata/image.adoc). The generator bind-mounts /persistent/shared/etc/ssh
# over /etc/ssh at early boot, and persistent-shared-init seeds it from the
# image copy first, so sshd_config and the sshd_config.d drop-ins still arrive
# from the rootfs while the directory itself becomes writable.
#
# SHARED ACROSS SLOTS ON PURPOSE. Host keys are DEVICE identity, not system
# identity. If they lived per-slot, an A/B update would silently present a new
# host key and every terminal that had pinned the Hub would report a MITM on
# the next boot. One device, one host key, across updates.
Version=1
Path=/etc/ssh
