openapi: 3.1.0
info:
  title: "KitLuy Management API"
  version: 0.1.0
  description: >-
    Back-office contract for Admin, Chain and Partner portals plus the Partner App and approved private integrations (RB v4 §10.1).
    STATUS: SCAFFOLDED — governance skeleton only. Business routes are added
    exclusively from approved contract specifications. Routes never expose
    provider-specific infrastructure details.
  x-kitluy-status: SCAFFOLDED
servers:
  # Origin root, not the versioned prefix: health and version probes are served
  # at the origin while business routes carry `/management/v1` in the path, so
  # every path below is absolute and unambiguous.
  - url: "https://[REQUIRED-production-domain]"
    description: "[REQUIRED: production domain — owner decision pending]"
x-kitluy-governance:
  authentication: "Supabase Auth JWT bearer; explicit permission grants + resource/environment scope; approval classes A0-A4 for sensitive mutations"
  scope-resolution: >-
    Every request resolves Tenant, Digital Store and Store Location scope
    server-side; grants are per-environment (RB v4 §8.5-8.6).
  idempotency: >-
    All mutating routes require an Idempotency-Key header; replays return the
    original result (RB v4 §10.2).
  pagination: "Cursor-based; limit+cursor parameters; stable ordering required."
  filtering: "Explicit allowlisted filter parameters per route; no raw query pass-through."
  rate-limit-policy: "Per principal and per scope; RATE_LIMITED error envelope with retry-after."
  error-catalogue: "@kitluy/api-errors ERROR_CODES registry."
  versioning: >-
    URI-versioned (/management/v1). Backwards compatible by default; breaking changes
    require a new major version and a deprecation window.
  deprecation-policy: "Sunset headers plus registry entry; minimum window is an owner decision [REQUIRED]."
  audit: "Every mutation emits an audit event with correlation ID."
  retry-behavior: "Retryable codes are marked in the error catalogue; clients use exponential backoff."
  freshness: "Read models expose source and data_as_of; stale data is labeled, never silent (RB v4 §9.7)."
  generated-clients: "Clients are generated from this file; generated code is never hand-edited."
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready
        "503":
          description: Service is not ready
  /version:
    get:
      operationId: version
      summary: Service identity and version
      responses:
        "200":
          description: Service name and version
  /management/v1/me:
    get:
      operationId: getCurrentAdmin
      summary: The calling Admin's canonical authority
      description: >-
        Resolves the caller's identity and the permission keys currently in
        force. No specific permission is required, but the caller must be an
        active Admin. Permission keys are evaluated by the canonical database
        evaluator for the caller, never taken from the request.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller is an active Admin
          content:
            application/json:
              schema:
                type: object
                required: [userId, permissions]
                properties:
                  userId: { type: string, format: uuid }
                  permissions:
                    type: array
                    items: { type: string }
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
  /management/v1/devices:
    get:
      operationId: listFleetDevices
      summary: Governed device fleet read model
      description: >-
        Requires the `fleet.read` permission. Device relations are closed to
        browsers (OD-ADMIN-FLEET-001); this route is the only read path. The
        response is an explicit DTO and never carries device-identity evidence
        such as key fingerprints, manifest digests or enrollment sequence.
        Cursor pagination is not implemented in this slice: `truncated` reports
        honestly when the page cap was reached.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authorized fleet page
          content:
            application/json:
              schema:
                type: object
                required: [devices, count, limit, truncated]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/FleetDevice" }
                  count: { type: integer }
                  limit: { type: integer }
                  truncated: { type: boolean }
                  freshnessPolicyRuled:
                    type: boolean
                    description: >-
                      false while the liveness threshold is an unruled owner
                      value; every device with a heartbeat then reports UNKNOWN.
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
  /management/v1/devices/{deviceId}:
    get:
      operationId: getFleetDevice
      summary: One governed device with derived provisioning readiness
      description: >-
        Requires the `fleet.read` permission. Provisioning readiness is DERIVED
        from canonical facts — there is no stored eligibility flag — and is a
        presentation gate only; the governed issuance path revalidates
        server-side.
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The authorized device
          content:
            application/json:
              schema:
                type: object
                required: [device, provisioning]
                properties:
                  device: { $ref: "#/components/schemas/FleetDevice" }
                  provisioning: { $ref: "#/components/schemas/ProvisioningReadiness" }
                  freshnessPolicyRuled: { type: boolean }
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404":
          description: No such device, or an identifier that cannot name one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /management/v1/devices-pending:
    get:
      operationId: listPendingRegistrations
      summary: Devices that registered themselves and await a HET decision
      description: >-
        Requires the `fleet.device_enrollment.approve` permission — NOT merely
        `fleet.read`. The evidence carried here (board serials, registration key
        fingerprints) is exactly what would be needed to forge a convincing
        registration, so it is not shown to every operator who may view the
        fleet. Every `claimed*` value is SELF-REPORTED by the device and is a
        claim, never a verified fact; that is why an approval step exists.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The pending queue
          content:
            application/json:
              schema:
                type: object
                required: [pending, count, fourEyesRequired]
                properties:
                  pending:
                    type: array
                    items: { $ref: "#/components/schemas/PendingRegistration" }
                  count: { type: integer }
                  limit: { type: integer }
                  truncated: { type: boolean }
                  fourEyesRequired:
                    type: boolean
                    description: >-
                      True in pilot and production, where the governed door
                      requires a second distinct approver. Told to the client so
                      the form does not hardcode an environment rule that lives
                      in the database.
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
  /management/v1/devices/{deviceId}/approve-enrollment:
    post:
      operationId: approveDeviceEnrollment
      summary: Admit one verified board to the trusted fleet
      description: >-
        Requires the `fleet.device_enrollment.approve` permission. VERIFY AND
        APPROVE, never a one-click "trust device": the caller must state a
        `reason` AND a `verificationEvidenceRef` recording WHAT was verified
        against the physical hardware, and both are refused when blank. The
        approver is taken from the verified token and never from the body.
        Moves `manufactured` -> `enrolled` only; a quarantined, retired,
        replaced or restricted device is never resurrected by an approval, and a
        device carrying an open trust incident is refused so a suspected clone
        cannot be approved past its own security finding. Approval makes a board
        provisioning-ELIGIBLE and issues no operational certificate (BLK-005).
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, verificationEvidenceRef]
              properties:
                reason: { type: string, minLength: 1 }
                verificationEvidenceRef:
                  type: string
                  minLength: 1
                  description: >-
                    Names the verification record — what was checked, not who
                    clicked. Written into the immutable lifecycle event.
                secondApproverRef:
                  type: string
                  minLength: 1
                  description: >-
                    Required in pilot and production, and refused when it equals
                    the acting approver. Omitted entirely when absent; an empty
                    string is refused rather than read as "no second approver".
      responses:
        "200":
          description: The device is admitted to the trusted fleet
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, lifecycleState]
                properties:
                  deviceId: { type: string, format: uuid }
                  lifecycleState: { type: string, enum: [enrolled] }
                  detail: { type: string }
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404":
          description: No such device, or an identifier that cannot name one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: >-
            The caller HELD the permission and the request was well-formed, but
            the governed door refused. `error.details.reason` carries the
            KLUY-APPROVE-* code so a client can branch without parsing prose.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          description: Approval is not configured on this instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
components:
  responses:
    Unauthenticated:
      description: >-
        No bearer token, or a token the auth server did not accept. Fails
        closed: an unreachable auth server is also a refusal.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Denied:
      description: >-
        Authenticated, but not permitted. `error.details.reason` distinguishes
        no-Admin-profile, disabled, inactive and missing-access so a portal can
        show the right message; the missing permission key is never named.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Supabase Auth JWT bearer; explicit permission grants + resource/environment scope; approval classes A0-A4 for sensitive mutations"
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Code from the @kitluy/api-errors registry
            message:
              type: string
            correlationId:
              type: string
            details:
              type: object
    FleetDevice:
      type: object
      description: >-
        Non-secret fleet summary. Device-identity evidence (key fingerprint,
        manifest digest, enrollment sequence) is deliberately absent: it is
        selected explicitly, never spread from the read-model row.
      required: [deviceId, deviceReference, deviceClass, lifecycle, freshness, requiresAttention]
      properties:
        deviceId: { type: string, format: uuid }
        deviceReference: { type: string }
        deviceClass: { type: string }
        hardwareProfile: { type: [string, "null"] }
        lifecycle:
          type: string
          description: >-
            Canonical lifecycle state. `quarantined` and
            `restricted_investigation` are abnormal and are presented as such.
        trustLevel: { type: [string, "null"] }
        certificateStatus: { type: [string, "null"] }
        assignmentState: { type: [string, "null"] }
        tenantReference: { type: [string, "null"] }
        digitalStoreReference: { type: [string, "null"] }
        locationReference: { type: [string, "null"] }
        terminalAssignmentCount: { type: integer }
        openIncidentCount: { type: integer }
        lastSeenAt: { type: [string, "null"], format: date-time }
        fleetStatus: { type: [string, "null"] }
        freshness:
          type: string
          enum: [ONLINE, STALE, OFFLINE, NEVER_SEEN, UNKNOWN]
          description: >-
            Derived, never stored. While the liveness threshold is an unruled
            owner value, a device with a heartbeat reports UNKNOWN — never a
            guessed ONLINE. NEVER_SEEN is a fact, not a threshold.
        requiresAttention: { type: boolean }
    PendingRegistration:
      type: object
      description: >-
        One board awaiting a HET decision. Every `claimed*` field is reported by
        the device itself and is named that way deliberately: an Admin reading
        this screen is verifying hardware, not reading facts the system knows.
      required: [deviceId, deviceReference, lifecycle, approvable]
      properties:
        deviceId: { type: string, format: uuid }
        deviceReference: { type: string }
        deviceClass: { type: string }
        hardwareProfile: { type: [string, "null"] }
        lifecycle: { type: string }
        trustLevel: { type: [string, "null"] }
        reportedHostname: { type: [string, "null"] }
        claimedBoardSerial: { type: [string, "null"] }
        claimedSocSerial: { type: [string, "null"] }
        claimedMacAddress: { type: [string, "null"] }
        installationGeneration: { type: [integer, "null"] }
        imageRelease: { type: [string, "null"] }
        registrationKeyFingerprint: { type: [string, "null"] }
        enrollmentSequence: { type: [integer, "null"] }
        firstSeenAt: { type: [string, "null"], format: date-time }
        lastRegistrationAt: { type: [string, "null"], format: date-time }
        openIncidents:
          type: array
          items:
            type: object
            properties:
              incidentType: { type: string }
              severity: { type: string }
              detectedAt: { type: string, format: date-time }
              detail: { type: [string, "null"] }
        suspectedCredentialReuse: { type: boolean }
        verificationEvidenceRecorded:
          type: boolean
          description: Always false. Approval is what records verification.
        approvable:
          type: boolean
          description: >-
            Derived with the SAME open-incident predicate the governed door
            applies. If this said true and the door disagreed, a verifier would
            meet an unexplained refusal after typing a reason.
        blockingReasons:
          type: array
          items: { type: string }
    ProvisioningReadiness:
      type: object
      description: >-
        Derived presentation gate, not the security boundary. No stored
        eligibility flag exists and none is created.
      required: [eligible, reasons]
      properties:
        eligible: { type: boolean }
        reasons:
          type: array
          items: { type: string }
