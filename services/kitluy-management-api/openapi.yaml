openapi: 3.1.0
info:
  title: "KitLuy Management API"
  version: 0.1.0
  description: >-
    Back-office contract for Admin, Chain and Partner portals plus the Partner App and approved private integrations (RB v4 §10.1).
    STATUS: SCAFFOLDED — governance skeleton only. Business routes are added
    exclusively from approved contract specifications. Routes never expose
    provider-specific infrastructure details.
  x-kitluy-status: SCAFFOLDED
servers:
  # Origin root, not the versioned prefix: health and version probes are served
  # at the origin while business routes carry `/management/v1` in the path, so
  # every path below is absolute and unambiguous.
  - url: "https://[REQUIRED-production-domain]"
    description: "[REQUIRED: production domain — owner decision pending]"
x-kitluy-governance:
  authentication: "Supabase Auth JWT bearer; explicit permission grants + resource/environment scope; approval classes A0-A4 for sensitive mutations"
  scope-resolution: >-
    Every request resolves Tenant, Digital Store and Store Location scope
    server-side; grants are per-environment (RB v4 §8.5-8.6).
  idempotency: >-
    All mutating routes require an Idempotency-Key header; replays return the
    original result (RB v4 §10.2).
  pagination: "Cursor-based; limit+cursor parameters; stable ordering required."
  filtering: "Explicit allowlisted filter parameters per route; no raw query pass-through."
  rate-limit-policy: "Per principal and per scope; RATE_LIMITED error envelope with retry-after."
  error-catalogue: "@kitluy/api-errors ERROR_CODES registry."
  versioning: >-
    URI-versioned (/management/v1). Backwards compatible by default; breaking changes
    require a new major version and a deprecation window.
  deprecation-policy: "Sunset headers plus registry entry; minimum window is an owner decision [REQUIRED]."
  audit: "Every mutation emits an audit event with correlation ID."
  retry-behavior: "Retryable codes are marked in the error catalogue; clients use exponential backoff."
  freshness: "Read models expose source and data_as_of; stale data is labeled, never silent (RB v4 §9.7)."
  generated-clients: "Clients are generated from this file; generated code is never hand-edited."
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready
        "503":
          description: Service is not ready
  /version:
    get:
      operationId: version
      summary: Service identity and version
      responses:
        "200":
          description: Service name and version
  /management/v1/me:
    get:
      operationId: getCurrentAdmin
      summary: The calling Admin's canonical authority
      description: >-
        Resolves the caller's identity and the permission keys currently in
        force. No specific permission is required, but the caller must be an
        active Admin. Permission keys are evaluated by the canonical database
        evaluator for the caller, never taken from the request.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller is an active Admin
          content:
            application/json:
              schema:
                type: object
                required: [userId, permissions]
                properties:
                  userId: { type: string, format: uuid }
                  permissions:
                    type: array
                    items: { type: string }
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
  /management/v1/devices:
    get:
      operationId: listFleetDevices
      summary: Governed device fleet read model
      description: >-
        Requires the `fleet.read` permission. Device relations are closed to
        browsers (OD-ADMIN-FLEET-001); this route is the only read path. The
        response is an explicit DTO and never carries device-identity evidence
        such as key fingerprints, manifest digests or enrollment sequence.
        Cursor pagination is not implemented in this slice: `truncated` reports
        honestly when the page cap was reached.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authorized fleet page
          content:
            application/json:
              schema:
                type: object
                required: [devices, count, limit, truncated]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/FleetDevice" }
                  count: { type: integer }
                  limit: { type: integer }
                  truncated: { type: boolean }
                  freshnessPolicyRuled:
                    type: boolean
                    description: >-
                      false while the liveness threshold is an unruled owner
                      value; every device with a heartbeat then reports UNKNOWN.
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
  /management/v1/devices/{deviceId}:
    get:
      operationId: getFleetDevice
      summary: One governed device with derived provisioning readiness
      description: >-
        Requires the `fleet.read` permission. Provisioning readiness is DERIVED
        from canonical facts — there is no stored eligibility flag — and is a
        presentation gate only; the governed issuance path revalidates
        server-side.
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The authorized device
          content:
            application/json:
              schema:
                type: object
                required: [device, provisioning]
                properties:
                  device: { $ref: "#/components/schemas/FleetDevice" }
                  provisioning: { $ref: "#/components/schemas/ProvisioningReadiness" }
                  freshnessPolicyRuled: { type: boolean }
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404":
          description: No such device, or an identifier that cannot name one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /management/v1/devices-pending:
    get:
      operationId: listPendingRegistrations
      summary: Devices that registered themselves and await a HET decision
      description: >-
        Requires the `fleet.device_enrollment.approve` permission — NOT merely
        `fleet.read`. The evidence carried here (board serials, registration key
        fingerprints) is exactly what would be needed to forge a convincing
        registration, so it is not shown to every operator who may view the
        fleet. Every `claimed*` value is SELF-REPORTED by the device and is a
        claim, never a verified fact; that is why an approval step exists.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The pending queue
          content:
            application/json:
              schema:
                type: object
                required: [pending, count, fourEyesRequired]
                properties:
                  pending:
                    type: array
                    items: { $ref: "#/components/schemas/PendingRegistration" }
                  count: { type: integer }
                  limit: { type: integer }
                  truncated: { type: boolean }
                  fourEyesRequired:
                    type: boolean
                    description: >-
                      True in pilot and production, where the governed door
                      requires a second distinct approver. Told to the client so
                      the form does not hardcode an environment rule that lives
                      in the database.
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
  /management/v1/devices/{deviceId}/approve-enrollment:
    post:
      operationId: approveDeviceEnrollment
      summary: Admit one verified board to the trusted fleet
      description: >-
        Requires the `fleet.device_enrollment.approve` permission. VERIFY AND
        APPROVE, never a one-click "trust device": the caller must state a
        `reason` AND a `verificationEvidenceRef` recording WHAT was verified
        against the physical hardware, and both are refused when blank. The
        approver is taken from the verified token and never from the body.
        Moves `manufactured` -> `enrolled` only; a quarantined, retired,
        replaced or restricted device is never resurrected by an approval, and a
        device carrying an open trust incident is refused so a suspected clone
        cannot be approved past its own security finding. Approval makes a board
        provisioning-ELIGIBLE and issues no operational certificate (BLK-005).
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, verificationEvidenceRef]
              properties:
                reason: { type: string, minLength: 1 }
                verificationEvidenceRef:
                  type: string
                  minLength: 1
                  description: >-
                    Names the verification record — what was checked, not who
                    clicked. Written into the immutable lifecycle event.
                secondApproverRef:
                  type: string
                  minLength: 1
                  description: >-
                    Required in pilot and production, and refused when it equals
                    the acting approver. Omitted entirely when absent; an empty
                    string is refused rather than read as "no second approver".
      responses:
        "200":
          description: The device is admitted to the trusted fleet
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, lifecycleState]
                properties:
                  deviceId: { type: string, format: uuid }
                  lifecycleState: { type: string, enum: [enrolled] }
                  detail: { type: string }
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404":
          description: No such device, or an identifier that cannot name one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: >-
            The caller HELD the permission and the request was well-formed, but
            the governed door refused. `error.details.reason` carries the
            KLUY-APPROVE-* code so a client can branch without parsing prose.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          description: Approval is not configured on this instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /management/v1/partner/stores:
    get:
      operationId: listPartnerStores
      summary: The Stores and Locations a Partner may provision devices for
      description: >-
        Requires `fleet.hub_pairing_code.issue`. Names are read as the actor
        under row-level security, so this can never list a Store the actor does
        not hold. Each Store carries its primary vertical code and, when the
        terminal dependency is wired, the readiness of its Store Hub
        (`active`, `pending_trust` or `none`); an absent `hub` means not
        reported, which a client must fail closed on.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The Partner's Stores
          content:
            application/json:
              schema:
                type: object
                required: [stores, count]
                properties:
                  stores:
                    type: array
                    items: { $ref: "#/components/schemas/PartnerStore" }
                  count: { type: integer }
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /management/v1/hub-pairing-codes:
    post:
      operationId: openHubPairingSession
      summary: Open a Store Hub pairing session for one Store and Location
      description: >-
        The code belongs to the Store; any enrolled Store Hub may use it. Returned
        once; only its digest is stored. Opening a session revokes any session
        already open for the same Store. Unknown fields are refused.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [digitalStoreId, storeLocationId]
              properties:
                digitalStoreId: { type: string, format: uuid }
                storeLocationId: { type: string, format: uuid }
      responses:
        "201":
          description: The session and its one-time code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingCodeIssued" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { description: No such Store or Location }
        "422": { description: Refused by validation or by the governed door }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /management/v1/hub-pairing-codes/{sessionId}:
    get:
      operationId: readHubPairingSession
      summary: What became of a Store Hub pairing session
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The session status. A session belonging to another Partner is reported as absent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingSessionStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { description: No such pairing session }
  /management/v1/partner/stores/{storeId}/terminals:
    get:
      operationId: listPhysicalTerminals
      summary: The named terminal seats of one Store
      description: >-
        Requires `fleet.terminal_pairing_code.issue` and the Store. Each seat
        carries its role set, the device bound to it (if any) and its latest
        pairing session.
      security:
        - bearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The seats
          content:
            application/json:
              schema:
                type: object
                required: [terminals, count]
                properties:
                  terminals:
                    type: array
                    items: { $ref: "#/components/schemas/PhysicalTerminal" }
                  count: { type: integer }
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /management/v1/partner/terminals:
    post:
      operationId: definePhysicalTerminal
      summary: Define a named terminal seat with a role set in one of the Partner's Stores
      description: >-
        The name is optional; a blank name is generated (`Terminal N`). Role keys
        have the structural shape `vertical.tN.role` and must belong to the
        Store's vertical. The Tenant is never accepted; the door derives it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [digitalStoreId, storeLocationId, terminalProfileKeys]
              properties:
                digitalStoreId: { type: string, format: uuid }
                storeLocationId: { type: string, format: uuid }
                label: { type: string, maxLength: 64 }
                terminalProfileKeys:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: { type: string }
      responses:
        "201":
          description: The seat
          content:
            application/json:
              schema:
                type: object
                required: [terminal]
                properties:
                  terminal: { $ref: "#/components/schemas/PhysicalTerminal" }
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { description: No such Store or Location }
        "422": { description: Refused by validation or by the governed door }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /management/v1/partner/terminals/{terminalId}/roles:
    post:
      operationId: setPhysicalTerminalRoles
      summary: Replace a seat's role set
      description: >-
        Refused while a pairing session is open for the seat, or while a device
        holds the assignment the seat produced. A seat in another Partner's
        Store is reported as absent.
      security:
        - bearerAuth: []
      parameters:
        - name: terminalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [terminalProfileKeys]
              properties:
                terminalProfileKeys:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: { type: string }
      responses:
        "200":
          description: The seat after the change
          content:
            application/json:
              schema:
                type: object
                required: [terminal]
                properties:
                  terminal: { $ref: "#/components/schemas/PhysicalTerminal" }
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { description: No such terminal }
        "422": { description: Refused by validation or by the governed door }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /management/v1/terminal-pairing-sessions:
    post:
      operationId: openTerminalPairingSession
      summary: Open a pairing session for one terminal seat and receive its code once
      description: >-
        One code, fifteen minutes, five attempts, single use. Opening a session
        supersedes any open session for the same seat. Refused without an active
        Store Hub at the seat's Location, without roles, or while a device holds
        the seat. There is no QR: the installer types the code on the Pi.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [physicalTerminalId]
              properties:
                physicalTerminalId: { type: string, format: uuid }
      responses:
        "201":
          description: The session and its one-time code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalPairingCodeIssued" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { description: No such terminal }
        "422": { description: Refused by validation or by the governed door }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /management/v1/terminal-pairing-sessions/{sessionId}:
    get:
      operationId: readTerminalPairingSession
      summary: What became of a terminal pairing session
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The session status. A session belonging to another Partner is reported as absent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalPairingSessionStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { description: No such pairing session }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /management/v1/terminal-pairing-sessions/{sessionId}/cancel:
    post:
      operationId: cancelTerminalPairingSession
      summary: Close an open terminal pairing session early
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The session's state after the request
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, outcome, state]
                properties:
                  sessionId: { type: string, format: uuid }
                  outcome: { type: string, enum: [cancelled, already_closed, unknown] }
                  state: { type: string }
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { description: No such pairing session }
        "503": { $ref: "#/components/responses/NotConfigured" }

  /management/v1/digital-stores:
    get:
      operationId: listDigitalStores
      summary: Every Digital Store with its Tenant in words (Admin)
      description: Requires `partners.read`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The Stores
          content:
            application/json:
              schema:
                type: object
                required: [stores, count]
                properties:
                  stores:
                    type: array
                    items: { $ref: "#/components/schemas/DigitalStore" }
                  count: { type: integer }
                  limit: { type: integer }
                  truncated: { type: boolean }
                  dataAsOf: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
    post:
      operationId: createDigitalStore
      summary: An Admin creates a Digital Store under a Tenant
      description: >-
        Requires `store.digital_store.create`. The Store is created in DRAFT with
        one primary vertical from the reference registry, optionally its first
        Location in the same transaction, optionally visible to the Tenant's
        existing Partner staff, with one audit row. Pilot and production require
        a second, different approver (see `fourEyesRequired` on the options
        route). The actor is the token's subject; unknown fields are refused.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenantId, storeCode, name, primaryVerticalCode, reason]
              properties:
                tenantId: { type: string, format: uuid }
                storeCode: { type: string, maxLength: 40 }
                name: { type: string, maxLength: 120 }
                primaryVerticalCode: { type: string }
                reason: { type: string, maxLength: 200 }
                grantExistingPartnerStaff: { type: boolean }
                secondApproverRef: { type: string }
                firstLocation:
                  type: object
                  additionalProperties: false
                  required: [locationCode, name]
                  properties:
                    locationCode: { type: string, maxLength: 40 }
                    name: { type: string, maxLength: 120 }
                    addressLine1: { type: string }
                    city: { type: string }
      responses:
        "201":
          description: The Store, with its audit event id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DigitalStoreCreated" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { description: No such Tenant }
        "422": { description: Refused by validation or by the governed door }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /management/v1/digital-stores/options:
    get:
      operationId: storeCreationOptions
      summary: What the create-Store form needs
      description: Requires `store.digital_store.create`. Tenants with their Partner verification status and existing Partner staff count; the vertical registry verbatim; whether this environment requires a second approver.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreCreationOptions" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Denied" }

components:
  responses:
    Unauthenticated:
      description: >-
        No bearer token, or a token the auth server did not accept. Fails
        closed: an unreachable auth server is also a refusal.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotConfigured:
      description: This deployment is not wired for the route (503, never 404)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Denied:
      description: >-
        Authenticated, but not permitted. `error.details.reason` distinguishes
        no-Admin-profile, disabled, inactive and missing-access so a portal can
        show the right message; the missing permission key is never named.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Supabase Auth JWT bearer; explicit permission grants + resource/environment scope; approval classes A0-A4 for sensitive mutations"
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Code from the @kitluy/api-errors registry
            message:
              type: string
            correlationId:
              type: string
            details:
              type: object
    FleetDevice:
      type: object
      description: >-
        Non-secret fleet summary. Device-identity evidence (key fingerprint,
        manifest digest, enrollment sequence) is deliberately absent: it is
        selected explicitly, never spread from the read-model row.
      required: [deviceId, deviceReference, deviceClass, lifecycle, freshness, requiresAttention]
      properties:
        deviceId: { type: string, format: uuid }
        deviceReference: { type: string }
        deviceClass: { type: string }
        hardwareProfile: { type: [string, "null"] }
        lifecycle:
          type: string
          description: >-
            Canonical lifecycle state. `quarantined` and
            `restricted_investigation` are abnormal and are presented as such.
        trustLevel: { type: [string, "null"] }
        certificateStatus: { type: [string, "null"] }
        assignmentState: { type: [string, "null"] }
        tenantReference: { type: [string, "null"] }
        digitalStoreReference: { type: [string, "null"] }
        locationReference: { type: [string, "null"] }
        terminalAssignmentCount: { type: integer }
        openIncidentCount: { type: integer }
        lastSeenAt: { type: [string, "null"], format: date-time }
        fleetStatus: { type: [string, "null"] }
        freshness:
          type: string
          enum: [ONLINE, STALE, OFFLINE, NEVER_SEEN, UNKNOWN]
          description: >-
            Derived, never stored. While the liveness threshold is an unruled
            owner value, a device with a heartbeat reports UNKNOWN — never a
            guessed ONLINE. NEVER_SEEN is a fact, not a threshold.
        requiresAttention: { type: boolean }
    PendingRegistration:
      type: object
      description: >-
        One board awaiting a HET decision. Every `claimed*` field is reported by
        the device itself and is named that way deliberately: an Admin reading
        this screen is verifying hardware, not reading facts the system knows.
      required: [deviceId, deviceReference, lifecycle, approvable]
      properties:
        deviceId: { type: string, format: uuid }
        deviceReference: { type: string }
        deviceClass: { type: string }
        hardwareProfile: { type: [string, "null"] }
        lifecycle: { type: string }
        trustLevel: { type: [string, "null"] }
        reportedHostname: { type: [string, "null"] }
        claimedBoardSerial: { type: [string, "null"] }
        claimedSocSerial: { type: [string, "null"] }
        claimedMacAddress: { type: [string, "null"] }
        installationGeneration: { type: [integer, "null"] }
        imageRelease: { type: [string, "null"] }
        registrationKeyFingerprint: { type: [string, "null"] }
        enrollmentSequence: { type: [integer, "null"] }
        firstSeenAt: { type: [string, "null"], format: date-time }
        lastRegistrationAt: { type: [string, "null"], format: date-time }
        openIncidents:
          type: array
          items:
            type: object
            properties:
              incidentType: { type: string }
              severity: { type: string }
              detectedAt: { type: string, format: date-time }
              detail: { type: [string, "null"] }
        suspectedCredentialReuse: { type: boolean }
        verificationEvidenceRecorded:
          type: boolean
          description: Always false. Approval is what records verification.
        approvable:
          type: boolean
          description: >-
            Derived with the SAME open-incident predicate the governed door
            applies. If this said true and the door disagreed, a verifier would
            meet an unexplained refusal after typing a reason.
        blockingReasons:
          type: array
          items: { type: string }
    ProvisioningReadiness:
      type: object
      description: >-
        Derived presentation gate, not the security boundary. No stored
        eligibility flag exists and none is created.
      required: [eligible, reasons]
      properties:
        eligible: { type: boolean }
        reasons:
          type: array
          items: { type: string }
    PartnerStore:
      type: object
      required: [digitalStoreId, digitalStoreReference, locations]
      properties:
        digitalStoreId: { type: string, format: uuid }
        digitalStoreReference: { type: string, description: "store_code — name" }
        vertical: { type: [string, "null"], description: The Store's primary vertical code, verbatim }
        locations:
          type: array
          items:
            type: object
            required: [storeLocationId, locationReference]
            properties:
              storeLocationId: { type: string, format: uuid }
              locationReference: { type: string }
        hub:
          type: object
          description: Store Hub readiness; absent when not reported
          required: [deviceReference, state]
          properties:
            deviceReference: { type: [string, "null"] }
            state: { type: string, description: "active · pending_trust · none, or the stored state verbatim" }
    PairingCodeIssued:
      type: object
      required: [code, sessionId, expiresAt, ttlSeconds, showOnce]
      properties:
        code: { type: string, description: Shown once; only its digest is stored }
        sessionId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        ttlSeconds: { type: integer }
        showOnce: { type: boolean }
        detail: { type: string }
    PairingSessionStatus:
      type: object
      required: [sessionId, state, paired, locked, expiresAt]
      properties:
        sessionId: { type: string, format: uuid }
        state: { type: string, description: "open · consumed · revoked · expired · locked" }
        paired: { type: boolean }
        pairedAt: { type: [string, "null"], format: date-time }
        pairedDeviceId: { type: [string, "null"], format: uuid }
        pairedDeviceReference: { type: [string, "null"] }
        failedAttemptCount: { type: integer }
        locked: { type: boolean }
        expiresAt: { type: string, format: date-time }
        dataAsOf: { type: string, format: date-time }
    PhysicalTerminal:
      type: object
      required: [physicalTerminalId, digitalStoreId, storeLocationId, label, terminalProfileKeys, boundDevice, lastSession, createdAt]
      properties:
        physicalTerminalId: { type: string, format: uuid }
        digitalStoreId: { type: string, format: uuid }
        storeLocationId: { type: string, format: uuid }
        locationReference: { type: [string, "null"] }
        label: { type: string }
        terminalProfileKeys: { type: array, items: { type: string } }
        boundDevice:
          type: [object, "null"]
          properties:
            deviceId: { type: string, format: uuid }
            deviceReference: { type: string }
            lifecycle: { type: string }
            assignmentState: { type: [string, "null"] }
        lastSession:
          type: [object, "null"]
          properties:
            sessionId: { type: string, format: uuid }
            state: { type: string }
            expiresAt: { type: string, format: date-time }
            pairedAt: { type: [string, "null"], format: date-time }
            failedAttemptCount: { type: integer }
            locked: { type: boolean }
        createdAt: { type: string, format: date-time }
    TerminalPairingCodeIssued:
      type: object
      required: [code, sessionId, expiresAt, ttlSeconds, showOnce, physicalTerminalId, label, terminalProfileKeys]
      properties:
        code: { type: string, description: Shown once; only its digest is stored. No QR is offered. }
        sessionId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        ttlSeconds: { type: integer }
        showOnce: { type: boolean }
        physicalTerminalId: { type: string, format: uuid }
        label: { type: string }
        terminalProfileKeys: { type: array, items: { type: string } }
        storeHubReference: { type: [string, "null"] }
        environment: { type: [string, "null"] }
        detail: { type: string }
    TerminalPairingSessionStatus:
      type: object
      required: [sessionId, physicalTerminalId, state, paired, expired, locked, expiresAt, terminalProfileKeys]
      properties:
        sessionId: { type: string, format: uuid }
        physicalTerminalId: { type: string, format: uuid }
        state: { type: string, description: "open · consumed · revoked · expired · locked" }
        paired: { type: boolean }
        expired: { type: boolean, description: Derived from the server clock for an open session past its deadline }
        pairedAt: { type: [string, "null"], format: date-time }
        pairedDeviceId: { type: [string, "null"], format: uuid }
        pairedDeviceReference: { type: [string, "null"] }
        failedAttemptCount: { type: integer }
        locked: { type: boolean }
        expiresAt: { type: string, format: date-time }
        terminalProfileKeys: { type: array, items: { type: string } }
        dataAsOf: { type: string, format: date-time }
    AssignmentContext:
      type: object
      description: Where an assigned device is, in words. Null on the device detail when unassigned.
      required: [assignmentState, terminalProfileKeys]
      properties:
        assignmentState: { type: string }
        tenantReference: { type: [string, "null"] }
        digitalStoreReference: { type: [string, "null"] }
        locationReference: { type: [string, "null"] }
        terminalProfileKeys: { type: array, items: { type: string } }
        physicalTerminalId: { type: [string, "null"], format: uuid }
        physicalTerminalLabel: { type: [string, "null"] }
    DigitalStore:
      type: object
      required: [digitalStoreId, storeCode, name, primaryVerticalCode, status, tenantId, tenantReference, locations, createdAt]
      properties:
        digitalStoreId: { type: string, format: uuid }
        storeCode: { type: string }
        name: { type: string }
        primaryVerticalCode: { type: string }
        status: { type: string }
        tenantId: { type: string, format: uuid }
        tenantReference: { type: string }
        locations:
          type: array
          items:
            type: object
            properties:
              storeLocationId: { type: string, format: uuid }
              locationCode: { type: string }
              name: { type: string }
              operatingStatus: { type: string }
        createdAt: { type: string, format: date-time }
    DigitalStoreCreated:
      type: object
      required: [digitalStoreId, storeCode, name, primaryVerticalCode, status, auditEventId, partnerStaffGranted]
      properties:
        digitalStoreId: { type: string, format: uuid }
        storeCode: { type: string }
        name: { type: string }
        primaryVerticalCode: { type: string }
        status: { type: string }
        storeLocationId: { type: [string, "null"], format: uuid }
        locationCode: { type: [string, "null"] }
        partnerStaffGranted: { type: integer }
        auditEventId: { type: string, format: uuid }
        detail: { type: string }
        dataAsOf: { type: string, format: date-time }
    StoreCreationOptions:
      type: object
      required: [tenants, verticals, fourEyesRequired]
      properties:
        tenants:
          type: array
          items:
            type: object
            properties:
              tenantId: { type: string, format: uuid }
              tenantCode: { type: string }
              displayName: { type: string }
              status: { type: string }
              partnerVerificationStatus: { type: [string, "null"] }
              partnerStaffCount: { type: integer }
        verticals:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              status: { type: string }
              labels:
                type: object
                properties:
                  km-KH: { type: [string, "null"] }
                  en-US: { type: [string, "null"] }
        fourEyesRequired: { type: boolean }
        dataAsOf: { type: string, format: date-time }
